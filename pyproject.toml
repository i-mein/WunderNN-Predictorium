[project]
name = "WunderNN-Predictorium-ml-project"
version = "0.1.0"
description = "A machine learning project for predicting future price movements based on Limit Order Book data."
requires-python = ">=3.11"
dependencies = [
    "torch",
    "numpy",
    "pandas",
    "tqdm",
    "wandb",
    "python-dotenv",
    "scipy",
    "matplotlib",
    "seaborn",
    "pyarrow",
    "ta",
    "tti",
    "scikit-learn",
    "pyyaml",
    "lightgbm>=4.6.0",
    "catboost>=1.2.8",
]
