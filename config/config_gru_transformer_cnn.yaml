model:
  name: GRU-Transformer-CNN
  input_size: 32
  hidden_size: 64
  num_layers: 2
  dropout: 0.3
  cnn:
    kernel_size: 3
    num_filters: 16
  transformer:
    num_heads: 4
    num_encoder_layers: 2
    num_decoder_layers: 2
    feedforward_dim: 128
  gru:
    bidirectional: true
    batch_first: true

training:
  batch_size: 64
  learning_rate: 0.001
  num_epochs: 50
  weight_decay: 1e-5
  early_stopping:
    patience: 5

data:
  train_file: "../datasets/train.parquet"
  valid_file: "../datasets/valid.parquet"
  sequence_length: 1000
  features:
    - p0
    - p1
    - p2
    - p3
    - p4
    - p5
    - p6
    - p7
    - p8
    - p9
    - p10
    - p11
    - v0
    - v1
    - v2
    - v3
    - v4
    - v5
    - v6
    - v7
    - v8
    - v9
    - v10
    - v11
    - dp0
    - dp1
    - dp2
    - dp3
    - dv0
    - dv1
    - dv2
    - dv3
  targets:
    - t0
    - t1

evaluation:
  metric: weighted_pearson
  save_best_model: true
  model_save_path: "../models/gru_transformer_cnn_best.pth"